<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine Surprise 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* Background */
.heart, .star {
  position: absolute;
  pointer-events: none;
}

.heart {
  bottom: -20px;
  animation: floatUp linear infinite;
}

.star {
  top: 0;
  animation: twinkle 2s infinite alternate;
}

@keyframes floatUp {
  to { transform: translateY(-120vh); opacity:0; }
}

@keyframes twinkle {
  from { opacity:0.3; }
  to { opacity:1; }
}

/* Card */
.card {
  position: relative;
  z-index: 10;
  background: white;
  padding: 25px;
  border-radius: 20px;
  width: 90%;
  max-width: 360px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

h1 { color:#ff4d6d; }

button {
  padding: 12px 22px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

.buttons {
  position: relative;
  height: 120px;
}

#yesBtn {
  background:#ff4d6d;
  color:white;
}

#noBtn {
  background:#ccc;
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
}

.message { display:none; font-size:18px; }

.back {
  margin-top: 15px;
  background:#ff4d6d;
  color:white;
}

/* Countdown */
.countdown {
  font-size: 16px;
  margin-top: 10px;
}

/* Rose */
.rose {
  font-size: 40px;
  animation: bloom 2s ease forwards;
}
@keyframes bloom {
  from { transform:scale(0); }
  to { transform:scale(1); }
}

/* Flipbook */
.page {
  display:none;
  font-size:18px;
}
.page.active { display:block; }

/* Game */
#gameArea {
  display:none;
  position: relative;
  height: 200px;
  border: 2px dashed #ff4d6d;
  border-radius: 10px;
  margin-top: 10px;
}
#gameHeart {
  position:absolute;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<div id="question">
  <h1>Nayan 💖</h1>
  <p>Will you be my Valentine? 💌</p>
  <div class="countdown" id="countdown"></div>

  <div class="buttons">
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🙈</button>
  </div>
</div>

<!-- YES FLOW -->
<div id="yesMsg" class="message"></div>

<!-- Flipbook -->
<div id="flipbook" class="message">
  <div class="page active">📖 Page 1: From the first smile…</div>
  <div class="page">💞 Page 2: Every moment felt special</div>
  <div class="page">🌹 Page 3: You became my favorite thought</div>
  <div class="page">❤️ Page 4: Will you stay my Valentine?</div>
  <br>
  <button onclick="nextPage()">Next ➡️</button>
</div>

<!-- Game -->
<div id="gameArea">
  <p>🎮 Catch the heart 3 times!</p>
  <div id="gameHeart">💖</div>
</div>

<button class="back" onclick="goBack()" style="display:none" id="backBtn">Go back</button>

</div>

<script>
/* Floating hearts & stars */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(15+Math.random()*20)+"px";
  h.style.animationDuration=(4+Math.random()*3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},400);

for(let i=0;i<30;i++){
  const s=document.createElement("div");
  s.className="star";
  s.innerHTML="✨";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  document.body.appendChild(s);
}

/* NO button */
const noBtn=document.getElementById("noBtn");
function moveNo(){
  noBtn.style.left=Math.random()*60+"%";
  noBtn.style.top=Math.random()*100+"px";
}
noBtn.addEventListener("pointerdown",moveNo);
noBtn.addEventListener("mouseenter",moveNo);

/* YES */
const yesBtn=document.getElementById("yesBtn");
const yesMsg=document.getElementById("yesMsg");
yesBtn.onclick=()=>{
  document.getElementById("question").style.display="none";
  yesMsg.style.display="block";
  typeText("💕 Yayyy! You said YES!\n\n🌹 A rose for you, Nayan 🌹\n\n<div class='rose'>🌹</div>");
};

/* Typing */
function typeText(text){
  yesMsg.innerHTML="";
  let i=0;
  function t(){
    if(i<text.length){
      yesMsg.innerHTML+=text[i];
      i++; setTimeout(t,30);
    }else{
      setTimeout(showFlipbook,1000);
    }
  }
  t();
}

/* Flipbook */
let pageIndex=0;
const pages=document.querySelectorAll(".page");
function showFlipbook(){
  yesMsg.style.display="none";
  document.getElementById("flipbook").style.display="block";
}
function nextPage(){
  pages[pageIndex].classList.remove("active");
  pageIndex++;
  if(pageIndex<pages.length){
    pages[pageIndex].classList.add("active");
  }else{
    startGame();
  }
}

/* Game */
let score=0;
const game=document.getElementById("gameArea");
const heart=document.getElementById("gameHeart");
function startGame(){
  document.getElementById("flipbook").style.display="none";
  game.style.display="block";
  moveHeart();
}
function moveHeart(){
  heart.style.left=Math.random()*80+"%";
  heart.style.top=Math.random()*120+"px";
}
heart.onclick=()=>{
  score++;
  if(score>=3){
    game.innerHTML="💖 You won my heart forever 💖";
    document.getElementById("backBtn").style.display="inline-block";
  }else{
    moveHeart();
  }
};

/* Countdown */
const target=new Date("Feb 14, 2026").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const d=target-now;
  if(d>0){
    document.getElementById("countdown").innerText=
      "⏳ Valentine’s Day in "+Math.floor(d/(1000*60*60*24))+" days";
  }
},1000);

/* Back */
function goBack(){
  location.reload();
}
</script>

</body>
</html>
