<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine Surprise 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* 💕 Floating hearts background */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 20px;
  color: rgba(255,255,255,0.8);
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh) scale(1.5);
    opacity: 0;
  }
}

.card {
  position: relative;
  z-index: 2;
  background: white;
  padding: 30px 25px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 360px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
}

h1 {
  color: #ff4d6d;
}

p {
  font-size: 18px;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 120px;
}

button {
  padding: 12px 22px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  position: absolute;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  left: 50%;
  transform: translateX(-50%);
}

#noBtn {
  background: #ccc;
  color: black;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
}

.message {
  display: none;
  font-size: 20px;
  margin-top: 20px;
}

.back {
  margin-top: 20px;
  background: #ff4d6d;
  color: white;
  padding: 10px 20px;
  border-radius: 25px;
  border: none;
  font-size: 16px;
}
</style>
</head>

<body>

<!-- 💕 Hearts container -->
<div id="hearts"></div>

<div class="card">
  <div id="question">
    <h1>Nayan 💖</h1>
    <p>Will you be my Valentine? 💌</p>

    <div class="buttons">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙈</button>
    </div>
  </div>

  <div id="yesMsg" class="message">
    💕 Yayyy! You just made my day, my Valentine 💕  
    <br><br>
    🌹 I’m lucky to have you, Nayan 🌹
    <br>
    <button class="back" onclick="goBack()">Go back</button>
  </div>

  <div id="noMsg" class="message">
    😢 Oh no… that hurts my heart 💔  
    <br><br>
    But I’ll still smile thinking of you 💗
    <br>
    <button class="back" onclick="goBack()">Go back</button>
  </div>
</div>

<script>
/* 💘 Floating hearts generator */
const heartsContainer = document.getElementById("hearts");

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  heart.style.fontSize = (16 + Math.random() * 20) + "px";
  heartsContainer.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 400);

/* 💕 Buttons logic */
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function moveNoButton() {
  const card = document.querySelector(".card");
  const maxX = card.offsetWidth - noBtn.offsetWidth;
  const maxY = 120;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}

noBtn.addEventListener("pointerdown", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);
noBtn.addEventListener("mouseenter", moveNoButton);

yesBtn.addEventListener("click", () => {
  document.getElementById("question").style.display = "none";
  document.getElementById("yesMsg").style.display = "block";
});

function goBack() {
  document.getElementById("question").style.display = "block";
  document.getElementById("yesMsg").style.display = "none";
  document.getElementById("noMsg").style.display = "none";
}
</script>

</body>
</html>
